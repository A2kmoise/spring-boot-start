spring:
  application:
    name: sping

  datasource:
    url: jdbc:mysql://localhost:3306/sping?createDatabaseIfNotExist=true
    username: moise
    password: pwd123
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    # This is the "magic switch" that fixes your current error
    baseline-on-migrate: true
    baseline-description: "Initial_Baseline"

  jpa:
    hibernate:
      # Changed from 'update' to 'validate' because Flyway is now
      # responsible for schema changes.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

# --- Custom Application Properties ---

stripe:
  apiUrl: https://a-noetapp.com
  timeout: 1000
  enabled: true
  supported-currency: USD,EUR,RWF

email:
  host: https://smtp.gmail.com
  port: 4567